<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Static Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f0f0f0;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    p {
      font-size: 1.2rem;
      color: #666;
    }
    a {
      color: #007acc;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Simple Static Page</h1>
  <p>This page is hosted on GitHub Pages and proxied by Cloudflare.</p>
  <p>Practice deploying static sites smoothly.</p>
  <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Visit GitHub</a>
</body>
</html>
